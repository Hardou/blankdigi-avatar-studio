name: Add AI Video Production Offer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-video-offer-patch.yml'

permissions:
  contents: write

jobs:
  patch-ai-video-offer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wire AI video offer into Avatar Studio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('ai-content-avatar/index.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              '<title>AI Content Avatar Studio | BlankDigi</title>',
              '<title>AI Content & Video Studio | BlankDigi</title>'
          )
          text = text.replace(
              '<meta name="description" content="Choose an AI avatar world for your brand. BlankDigi builds scripts, visuals, captions, approvals, and weekly content systems around your avatar." />',
              '<meta name="description" content="BlankDigi creates AI avatars, product ads, cinematic brand films, comedy creatives and recurring short-form video systems for brands." />'
          )
          text = text.replace(
              '<meta property="og:title" content="AI Content Avatar Studio | BlankDigi" />',
              '<meta property="og:title" content="AI Content & Video Studio | BlankDigi" />'
          )
          text = text.replace(
              '<meta property="og:description" content="Pick your avatar world. BlankDigi builds the content system around it." />',
              '<meta property="og:description" content="AI avatar systems and commercial AI video production for brands, ads and social content." />'
          )

          old = '  <script src="avatar-worlds.js"></script>'
          new = '  <script src="avatar-worlds.js"></script>\n  <script src="ai-video-offer.js"></script>'
          if 'ai-video-offer.js' not in text:
              if old not in text:
                  raise SystemExit('avatar-worlds.js script tag not found')
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit studio changes
        shell: bash
        run: |
          git config user.name "BlankDigi Automation"
          git config user.email "96664252+Hardou@users.noreply.github.com"
          git add ai-content-avatar/index.html
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git commit -m "Wire AI video production offer into Avatar Studio"
          git push origin HEAD:main
