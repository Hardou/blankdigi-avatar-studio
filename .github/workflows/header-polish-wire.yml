name: Wire Header Polish Script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/header-polish-wire.yml'

permissions:
  contents: write

jobs:
  wire-header-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add header polish script to Avatar Studio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('ai-content-avatar/index.html')
          html = page.read_text(encoding='utf-8')
          marker = '  <script src="ai-video-offer.js"></script>'
          script = '  <script src="header-polish.js"></script>'
          if script not in html:
              if marker not in html:
                  raise SystemExit('ai-video-offer.js marker not found')
              html = html.replace(marker, marker + '\n' + script)
              page.write_text(html, encoding='utf-8')
          PY

      - name: Commit wired script
        shell: bash
        run: |
          git config user.name "BlankDigi Automation"
          git config user.email "96664252+Hardou@users.noreply.github.com"
          git add ai-content-avatar/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Load premium header polish on Avatar Studio"
            git push
          fi
